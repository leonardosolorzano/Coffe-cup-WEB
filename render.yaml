services:
  - type: web
    name: coffe-cup-backend
    runtime: node
    rootDir: backend-ecommerce
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # ── Set these manually in the Render dashboard ─────────────────────────
      # DATABASE_URL        → Internal Database URL from your Render PostgreSQL service
      # APP_KEYS            → 4 random base64 strings separated by commas
      #                       e.g. openssl rand -base64 32 (run 4 times)
      # API_TOKEN_SALT      → openssl rand -base64 32
      # ADMIN_JWT_SECRET    → openssl rand -base64 32
      # TRANSFER_TOKEN_SALT → openssl rand -base64 32
      # JWT_SECRET          → openssl rand -base64 32
      # ENCRYPTION_KEY      → openssl rand -base64 32
      # PUBLIC_URL          → https://<your-render-service-name>.onrender.com
      # FRONTEND_URL        → https://<your-frontend-domain>  (required for CORS)
      # ───────────────────────────────────────────────────────────────────────
